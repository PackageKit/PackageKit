name: Build Test

on: [push, pull_request]

permissions:
  contents: read

jobs:
  linux-build-test:
    name: Linux (Build & Test)
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - distro: debian
            backend: apt
          - distro: fedora
            backend: dnf5
          - distro: arch
            backend: alpm
          - distro: opensuse
            backend: zypp
          - distro: solus
            backend: eopkg
          - distro: gentoo
            backend: portage
          - distro: pld
            backend: poldek
            # the poldek backend needs neither, and they would pull in the GTK stack
            options: -Dgtk-module=false -Dgstreamer-plugin=false
          - distro: nix
            backend: nix
            # the nixos/nix image has no system D-Bus or polkit setup
            options: -Ddaemon-tests=false
      fail-fast: false

    steps:
      - name: Get this version
        uses: actions/checkout@v7

      - name: Get version from last ABI break
        uses: actions/checkout@v7
        with:
          ref: ${{ env.LAST_ABI_BREAK }}
          path: original-version
        if: ${{ matrix.distro == 'debian' }}

      - name: Create Build Environment
        run: podman build -t packagekit-${{ matrix.distro }} -f tests/ci/Dockerfile-${{ matrix.distro }} .

      - name: Build & Test
        run: podman run -t --privileged -v `pwd`:/build packagekit-${{ matrix.distro }}
             ./tests/ci/build-and-test.sh -Dpk-backend=${{ matrix.backend }} ${{ matrix.options }}

      # a real daemon with the poldek backend, which changes the container's system
      - name: Smoke Test
        if: ${{ matrix.backend == 'poldek' }}
        run: podman run -t --privileged -v `pwd`:/build packagekit-${{ matrix.distro }}
             ./backends/poldek/tests/pk-poldek-smoke.py build

  freebsd-build-test:
    name: FreeBSD (Build & Test)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: cpa.sh {0}

    steps:
      - uses: actions/checkout@v7

      - name: Start VM
        uses: cross-platform-actions/action@e0b9770014ba65d5e0815f15b74031c3a635f641 #v1.6.0
        with:
          operating_system: freebsd
          version: '15.1'

      - name: Run
        run: |
          # Use latest package set
          sudo mkdir -p /usr/local/etc/pkg/repos/
          sudo cp /etc/pkg/FreeBSD.conf /usr/local/etc/pkg/repos/FreeBSD.conf
          sudo sed -i.bak -e 's|/quarterly|/latest|' /usr/local/etc/pkg/repos/FreeBSD.conf

          echo "::group::Dependencies installation"
          sudo -E pkg install -y \
              docbook-xsl-ns vala libxslt fontconfig polkit consolekit2 \
              desktop-file-utils gettext meson ninja python3 glib gtk3 pkgconf \
              sqlite3 gobject-introspection jansson dbus bash
          echo "::endgroup::"

          # Allow the pk-test-e2e test to run
          sed -i.bak -e 's|/usr/share/|/usr/local/share|g' tests/runner/run-daemon-test.py

          echo "::group::Building"
          meson --auto-features=enabled -Db_colorout=never --buildtype=debug \
                -Dlocalstatedir=/var \
                -Dsystemd=false \
                -Doffline-updates=false \
                -Dbash-completion=false \
                -Dbash-command-not-found=false \
                -Dgstreamer-plugin=false \
                -Dpk-backend=freebsd \
                _build
          cd _build
          ninja all
          echo "::endgroup::"

          echo "::group::Testing"
          sudo service dbus onestart
          ninja test
          echo "::endgroup::"
