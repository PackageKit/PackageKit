[Backend]
Exec=pk-backend-poldek
Description=poldek - PLD Linux package manager
Author=Arkadiusz Miśkiewicz <arekm@maven.pl>
# SIGKILL during a transaction would leave rpm running as an orphan: it completes the transaction
# the daemon then reports as failed, and the next job runs into rpm's lock
AllowSigkill=false
